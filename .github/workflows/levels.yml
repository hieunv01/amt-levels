# Tính POC/VAH/VAL tuần + tháng cho NQ, ES, NKD và commit vào thư mục levels/.
# Giờ cron là UTC: 22:10 UTC (CN-T5) = 05:10 VN (T2-T6); 07:10 UTC = 14:10 VN; 11:10 UTC = 18:10 VN.
name: AMT levels

on:
  schedule:
    - cron: "10 22 * * 0-4"
    - cron: "10 7 * * 1-5"
    - cron: "10 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: amt-levels
  cancel-in-progress: false

jobs:
  levels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[yfinance]"

      - name: Compute levels
        run: python run_levels.py --symbols NQ ES NKD --out levels

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add levels
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "levels $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
